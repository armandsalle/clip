# Vérifications à chaque PR et sur main. Par PR : Preview de clip-web sur le staging
# (PR d'interface) ou environnement complet (PR serveur). Sur main : staging. La
# production se déploie à la publication d'une release (release.yml). Secrets (créés à la main, cf. CONTRIBUTING.md) :
# CLOUDFLARE_API_TOKEN (token à permissions limitées) et NEON_API_KEY.
name: CI

on:
  pull_request:
    # `labeled` : l'étiquette env-complet relance le tri.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CF_SEND_TELEMETRY: "false"
  # Identifiant du compte (non secret, déjà dans packages/config).
  CLOUDFLARE_ACCOUNT_ID: cf7f360cd85645322d03de3ffb22249e

jobs:
  check:
    name: Vérifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true
      # Types Env générés depuis cloudflare.config.ts (.cloudflare/ n'est pas versionné).
      - run: vp run -r types
      - run: vp check
      - run: vp run -r test

  # PR d'interface si tous les fichiers modifiés sont dans le site (code, fichiers
  # statiques, proxy) ou la documentation ; sinon environnement complet. L'étiquette
  # env-complet force l'environnement complet.
  tri:
    name: Type d'environnement
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.tri.outputs.kind }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: tri
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          FORCE: ${{ contains(github.event.pull_request.labels.*.name, 'env-complet') }}
        run: |
          others=$(git diff --name-only "$BASE"...HEAD \
            | grep -vE '^(apps/web/(src|public|worker)/|apps/web/index\.html$|docs/|[^/]*\.md$)' || true)
          if [ "$FORCE" = "true" ] || [ -n "$others" ]; then kind=complet; else kind=interface; fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "Environnement : $kind"
          [ -n "$others" ] && printf 'Hors du site :\n%s\n' "$others" || true

  preview:
    name: Environnement de PR
    needs: [check, tri]
    # Jamais pour une PR venue d'un fork : elle n'a pas accès aux secrets.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    # Un seul déploiement à la fois par PR, jamais interrompu (ressources à moitié créées).
    concurrency:
      group: pr-env-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true
      # ffmpeg génère la vidéo du test de fumée.
      - run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg)
      # Une PR déjà passée en environnement complet le garde (voir scripts/env.ts).
      - id: env
        run: vp run ${{ needs.tri.outputs.kind == 'interface' && 'pr:preview' || 'pr:up' }} ${{ github.event.pull_request.number }}
      # Par workers.dev : le Bot Fight Mode de clipshare.dev bloque les runners (403).
      - run: vp run smoke ${{ steps.env.outputs.ci_url }}
      - name: Commentaire sur la PR
        if: always()
        uses: actions/github-script@v9
        env:
          URL: ${{ steps.env.outputs.url }}
          KIND: ${{ steps.env.outputs.kind }}
          OUTCOME: ${{ job.status }}
        with:
          script: |
            const marker = "<!-- clip-pr-env -->";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const n = context.issue.number;
            const details = process.env.KIND === "interface"
              ? `Preview \`pr-${n}\` de clip-web, branchée sur le staging (clip-api-staging, branche Neon \`staging\`, données de test partagées). Pour tester l'api, le pipeline ou la base : étiquette \`env-complet\`. Supprimée à la fermeture de la PR.`
              : `Trois Workers \`*-pr-${n}\`, branche Neon \`pr-${n}\`, vrai Stream (vidéos étiquetées \`clip-pr-${n}\`) et vraie IA, emails coupés. Tout est supprimé à la fermeture de la PR, vidéos Stream comprises.`;
            const title = process.env.KIND === "interface" ? "Preview de PR prête" : "Environnement de PR prêt";
            const body = process.env.OUTCOME === "success"
              ? `${marker}\n### ${title}\n\n${process.env.URL}\n\nCommit ${sha} · test de fumée vert · [journal](${run})\n\n${details}`
              : `${marker}\n### Environnement de PR en échec\n\nCommit ${sha} · [journal](${run})`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

  staging:
    name: Staging
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: https://staging.clipshare.dev
    concurrency:
      group: staging
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true
      # ffmpeg génère la vidéo du test de fumée.
      - run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg)
      # Migrations sur la branche Neon staging, clip-jobs-staging, clip-api-staging et la
      # Preview staging de clip-web. La production attend une release (release.yml).
      - id: staging
        run: vp run staging:up
      - run: vp run smoke ${{ steps.staging.outputs.ci_url }}
