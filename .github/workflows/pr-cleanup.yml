# Suppression complète de l'environnement d'une PR à sa fermeture (fusionnée ou non).
name: Nettoyage PR

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

env:
  CF_SEND_TELEMETRY: "false"
  CLOUDFLARE_ACCOUNT_ID: cf7f360cd85645322d03de3ffb22249e

jobs:
  down:
    name: Suppression de l'environnement
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: pr-env-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true
      - run: vp run pr:down ${{ github.event.pull_request.number }}
      - uses: actions/github-script@v9
        with:
          script: |
            const marker = "<!-- clip-pr-env -->";
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const existing = comments.find((c) => c.body?.includes(marker));
            const body = `${marker}\n### Environnement de PR supprimé\n\nWorkers, Workflow, Queue, bucket R2, Hyperdrive et branche Neon \`pr-${context.issue.number}\`.`;
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
